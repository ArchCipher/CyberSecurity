user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
      worker_connections 768;
}

http {
      server {
      listen         127.0.0.1:80 default_server;
      server_name    _;

      root           /var/www/onion;  # static files' location
      index          index.html;
        
            location / {
                  try_files $uri $uri/ =404;
            }
      }
}
